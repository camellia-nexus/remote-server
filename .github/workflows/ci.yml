name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
      - 'gemini/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-server-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features
      - name: Test
        run: cargo test --locked --workspace --all-features

  required:
    name: CI / Required
    if: always()
    needs:
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce required results
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          [[ "$QUALITY_RESULT" == success ]] || {
            echo "Quality must succeed, got: $QUALITY_RESULT" >&2
            exit 1
          }
