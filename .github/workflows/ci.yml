name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
      - 'gemini/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-server-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Validate release metadata
        run: python3 scripts/test_release_metadata.py
      - name: Test and validate source provenance
        run: |
          python3 scripts/test_source_provenance.py
          python3 scripts/validate_source_provenance.py --component camellia-remote-server
      - name: Validate Compose model
        env:
          CAMELLIA_REMOTE_API_SERVER: https://api.example.com
          CAMELLIA_REMOTE_DEVICE_VERIFICATION_TOKEN_FILE: /tmp/device-verification-token
          CAMELLIA_REMOTE_RELAY_ADDRESS: relay.example.com:21117
          CAMELLIA_REMOTE_SERVER_IMAGE: ghcr.io/example/remote-server@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: docker compose config --quiet

  deployment:
    name: Deployment and automation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Validate systemd units
        run: python3 scripts/validate_systemd_security.py deploy/systemd/*.service

      - name: Run systemd security validator unit tests
        run: python3 scripts/test_validate_systemd_security.py

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve image version
        id: metadata
        run: python3 scripts/release_metadata.py --github-output

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: camellia-remote-server:test
          provenance: false
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Hardened container runtime smoke test
        run: bash .github/scripts/smoke-test-container.sh camellia-remote-server:test

      - name: Run container release test suite
        run: |
          python3 .github/scripts/test_container_release_evidence.py
          bash .github/scripts/tests/test_resolve_container_registries.sh
          bash .github/scripts/tests/test_verify_release_image.sh
          bash .github/scripts/tests/test_smoke_test_container.sh

  performance-smoke:
    name: Server performance contract smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
      - name: Checkout exact control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          submodules: recursive
      - name: Install exact toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # zizmor: ignore[superfluous-actions]
        with:
          toolchain: "1.99.1"
      - name: Validate shared performance contract
        run: python3 -m unittest -v tools.test_performance_contract
        working-directory: candidate/libs/camellia_remote_protocol
      - name: Build and compare production parser observations
        env:
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
          CONTROL_REVISION: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 control/examples
          install -m 0644 \
            candidate/examples/performance_observation.rs \
            control/examples/performance_observation.rs
          CARGO_TARGET_DIR="$RUNNER_TEMP/server-performance-target" \
            cargo build --locked --release --example performance_observation \
            --manifest-path control/Cargo.toml
          install -m 0755 \
            "$RUNNER_TEMP/server-performance-target/release/examples/performance_observation" \
            "$RUNNER_TEMP/server-control-observation"
          CARGO_TARGET_DIR="$RUNNER_TEMP/server-performance-target" \
            cargo build --locked --release --example performance_observation \
            --manifest-path candidate/Cargo.toml
          install -m 0755 \
            "$RUNNER_TEMP/server-performance-target/release/examples/performance_observation" \
            "$RUNNER_TEMP/server-candidate-observation"
          python3 candidate/libs/camellia_remote_protocol/tools/performance_contract.py collect-pair \
            --repository remote-server \
            --control-revision "$CONTROL_REVISION" \
            --candidate-revision "$CANDIDATE_REVISION" \
            --scenario server-trusted-proxy-v1 \
            --tier pr-smoke \
            --runner-class github-ubuntu-24.04-x64 \
            --toolchain rust-1.99.1 \
            --iterations 5 --warmups 1 --timeout-seconds 30 \
            --control-output "$RUNNER_TEMP/server-control-performance.json" \
            --candidate-output "$RUNNER_TEMP/server-candidate-performance.json" \
            -- "$RUNNER_TEMP/server-control-observation" \
            ::: "$RUNNER_TEMP/server-candidate-observation"
          python3 candidate/libs/camellia_remote_protocol/tools/performance_contract.py compare \
            "$RUNNER_TEMP/server-control-performance.json" \
            "$RUNNER_TEMP/server-candidate-performance.json" \
            candidate/performance/server-trusted-proxy-v1.json \
            --output "$RUNNER_TEMP/server-performance-comparison.json"
      - name: Upload bounded performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-performance-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/server-control-performance.json
            ${{ runner.temp }}/server-candidate-performance.json
            ${{ runner.temp }}/server-performance-comparison.json
          if-no-files-found: error
          retention-days: 14

  required:
    name: CI / Required
    if: always()
    needs:
      - quality
      - deployment
      - performance-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce required results
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          PERFORMANCE_SMOKE_RESULT: ${{ needs.performance-smoke.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [[ "$QUALITY_RESULT" == success ]] || {
            echo "Quality must succeed, got: $QUALITY_RESULT" >&2
            exit 1
          }
          [[ "$DEPLOYMENT_RESULT" == success ]] || {
            echo "Deployment must succeed, got: $DEPLOYMENT_RESULT" >&2
            exit 1
          }
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$PERFORMANCE_SMOKE_RESULT" == success ]] || {
              echo "Performance smoke must succeed, got: $PERFORMANCE_SMOKE_RESULT" >&2
              exit 1
            }
          else
            [[ "$PERFORMANCE_SMOKE_RESULT" == skipped ]] || {
              echo "Performance smoke must be skipped outside pull requests, got: $PERFORMANCE_SMOKE_RESULT" >&2
              exit 1
            }
          fi
