name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: remote-server-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build Linux release binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Extract metadata
        id: meta
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            tag="v${version}"
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: cargo build --locked --release --bins

      - name: Package release bundle
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          stage="camellia-remote-server-${VERSION}-linux-x86_64"
          mkdir -p "release/$stage/bin" "release/$stage/systemd"
          install -m 0755 target/release/camellia-remote-identity "release/$stage/bin/"
          install -m 0755 target/release/camellia-remote-relay "release/$stage/bin/"
          install -m 0755 target/release/camellia-remote-utils "release/$stage/bin/"
          install -m 0644 deploy/systemd/*.service "release/$stage/systemd/"
          install -m 0600 deploy/server.env.example "release/$stage/server.env.example"
          [ -f LICENSE ] && install -m 0644 LICENSE "release/$stage/"
          [ -f NOTICE ] && install -m 0644 NOTICE "release/$stage/"
          [ -f SECURITY.md ] && install -m 0644 SECURITY.md "release/$stage/"
          (cd "release/$stage" && sha256sum bin/* systemd/* server.env.example > SHA256SUMS)
          tar -czf "release/$stage.tar.gz" -C release "$stage"
          (cd release && sha256sum "$stage.tar.gz" > SHA256SUMS)

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf6581a511820c01c156 # v4.4.3
        with:
          name: server-release-binaries
          path: |
            release/*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  build-container:
    name: Build and publish container image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4460bfa22da0b138fe57943333ad # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            tag="v${version}"
          fi
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/remote-server"
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-binaries
      - build-container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract metadata
        id: meta
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: server-release-binaries
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe148935b9c7a18710d303650affda02e0c44 # v2.2.1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.tar.gz
            release/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
